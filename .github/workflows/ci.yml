name: Xerces CI

on:
  push:
    branches:
      - maintenance
      - feature/release-build
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: xerces-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Package
        run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maven-build-log
          if-no-files-found: ignore
          path: |
            target/surefire-reports/**
            target/*.jar

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test
        run: mvn -B test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          if-no-files-found: ignore
          path: target/surefire-reports/**
